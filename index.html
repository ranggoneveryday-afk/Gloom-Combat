<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gloomy Hamster Gold - Telegram Mini App</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #07090e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            background: radial-gradient(circle at 50% 10%, #1e1b2e 0%, #08090d 70%);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* Glow Effect Background */
        .ambient-glow {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, rgba(243, 156, 18, 0.25) 0%, rgba(0,0,0,0) 70%);
            z-index: 1;
            pointer-events: none;
        }

        /* Header Info Status */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            border-radius: 20px;
            z-index: 2;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #000;
        }

        .user-info .name {
            font-size: 0.85rem;
            font-weight: 700;
        }

        .user-info .rank {
            font-size: 0.7rem;
            color: #f1c40f;
            font-weight: 600;
        }

        /* Top Cards Info */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 15px;
            z-index: 2;
        }

        .stat-card {
            background: rgba(20, 24, 38, 0.7);
            border: 1px solid rgba(241, 196, 15, 0.15);
            border-radius: 14px;
            padding: 10px 6px;
            text-align: center;
        }

        .stat-card .label {
            font-size: 0.65rem;
            color: #8b92a5;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .stat-card .val {
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            font-weight: 800;
            color: #f1c40f;
        }

        /* Balance Display */
        .balance-box {
            text-align: center;
            margin: 20px 0 10px 0;
            z-index: 2;
        }

        .balance-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #8b92a5;
            font-weight: 700;
        }

        .balance-value {
            font-family: 'Outfit', sans-serif;
            font-size: 3.2rem;
            font-weight: 900;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .coin-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #ffe066, #f39c12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(243, 156, 18, 0.6);
            color: #000;
            font-size: 1.4rem;
        }

        /* Interactive Clicker Circle */
        .clicker-area {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto 0;
            position: relative;
            z-index: 2;
        }

        .circle-outer {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: linear-gradient(145deg, rgba(243, 156, 18, 0.2), rgba(0,0,0,0.4));
            padding: 10px;
            box-shadow: 0 0 35px rgba(243, 156, 18, 0.25);
            cursor: pointer;
            transition: transform 0.08s cubic-bezier(0, 0, 0.2, 1);
        }

        .circle-outer:active {
            transform: scale(0.94);
        }

        .circle-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #121522;
            border: 4px solid #f39c12;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.9);
            position: relative;
            overflow: hidden;
        }

        .hamster-avatar-svg {
            width: 140px;
            height: 140px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
        }

        /* Floating +1 Numbers */
        .tap-pop {
            position: absolute;
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffe066;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            pointer-events: none;
            animation: popUp 0.7s cubic-bezier(0, 0, 0.2, 1) forwards;
            z-index: 10;
        }

        @keyframes popUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-70px) scale(1.3); }
        }

        /* Bottom Controls & Navigation */
        .bottom-nav {
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 2;
        }

        .energy-bar-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .energy-text {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            color: #f1c40f;
            font-size: 0.9rem;
        }

        .boost-btn {
            background: linear-gradient(90deg, #f39c12, #e67e22);
            color: #000;
            border: none;
            padding: 6px 14px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .nav-menu {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background: rgba(15, 18, 28, 0.9);
            padding: 8px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 0;
            color: #6c757d;
            font-size: 0.65rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 12px;
        }

        .nav-item.active {
            color: #f1c40f;
            background: rgba(241, 196, 15, 0.1);
        }

        .nav-item i {
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="ambient-glow"></div>

        <!-- Top Header -->
        <div class="header-section">
            <div class="user-profile">
                <div class="avatar">T</div>
                <div class="user-info">
                    <div class="name">Tuan (CEO)</div>
                    <div class="rank"><i class="fa-solid fa-crown"></i> Gloom Master</div>
                </div>
            </div>
            <div style="font-size: 0.75rem; color: #8b92a5; font-weight: 700;">SOLANA</div>
        </div>

        <!-- Top Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">Per Ketukan</div>
                <div class="val" id="perTapVal">+1</div>
            </div>
            <div class="stat-card">
                <div class="label">Naik Level</div>
                <div class="val">50K</div>
            </div>
            <div class="stat-card">
                <div class="label">Profit / Jam</div>
                <div class="val">+0</div>
            </div>
        </div>

        <!-- Balance Section -->
        <div class="balance-box">
            <div class="balance-label">Total Saldo $GLOOM</div>
            <div class="balance-value">
                <div class="coin-icon"><i class="fa-solid fa-coins"></i></div>
                <span id="score">0</span>
            </div>
        </div>

        <!-- Tap Circle Game -->
        <div class="clicker-area">
            <div class="circle-outer" id="tapBtn">
                <div class="circle-inner">
                    <!-- SVG Visual Vector Hamster Sedih Bermahkota Emas -->
                    <svg class="hamster-avatar-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="100" cy="115" r="55" fill="#D2B48C"/>
                        <circle cx="65" cy="70" r="18" fill="#D2B48C"/>
                        <circle cx="65" cy="70" r="10" fill="#FFC0CB"/>
                        <circle cx="135" cy="70" r="18" fill="#D2B48C"/>
                        <circle cx="135" cy="70" r="10" fill="#FFC0CB"/>
                        <circle cx="100" cy="115" r="42" fill="#FFE4C4"/>
                        <!-- Eyes & Tears -->
                        <ellipse cx="80" cy="105" rx="9" ry="12" fill="#1A1A1A"/>
                        <ellipse cx="120" cy="105" rx="9" ry="12" fill="#1A1A1A"/>
                        <circle cx="77" cy="100" r="4" fill="white"/>
                        <circle cx="117" cy="100" r="4" fill="white"/>
                        <path d="M78 118 Q73 130 75 138 Q78 143 82 138 Q84 130 78 118Z" fill="#70D6FF"/>
                        <!-- Mouth -->
                        <path d="M93 122 Q100 117 107 122" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
                        <!-- Crown -->
                        <path d="M70 62 L80 42 L100 55 L120 42 L130 62 Z" fill="#FFD700" stroke="#DAA520" stroke-width="2"/>
                        <circle cx="80" cy="42" r="3" fill="#FF0000"/>
                        <circle cx="100" cy="55" r="3" fill="#00DEF6"/>
                        <circle cx="120" cy="42" r="3" fill="#FF0000"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Controls & Bottom Bar -->
        <div class="bottom-nav">
            <div class="energy-bar-container">
                <div class="energy-text">
                    <i class="fa-solid fa-bolt"></i>
                    <span id="energy">1000</span> / 1000
                </div>
                <button class="boost-btn" id="boostBtn">
                    <i class="fa-solid fa-rocket"></i> Boost (+1)
                </button>
            </div>

            <div class="nav-menu">
                <div class="nav-item active">
                    <i class="fa-solid fa-hand-pointer"></i>
                    <span>Tap</span>
                </div>
                <div class="nav-item">
                    <i class="fa-solid fa-pickaxe"></i>
                    <span>Mine</span>
                </div>
                <div class="nav-item">
                    <i class="fa-solid fa-users"></i>
                    <span>Friends</span>
                </div>
                <div class="nav-item">
                    <i class="fa-solid fa-wallet"></i>
                    <span>Wallet</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let score = 0;
        let perTap = 1;
        let energy = 1000;
        const maxEnergy = 1000;

        const scoreEl = document.getElementById('score');
        const energyEl = document.getElementById('energy');
        const perTapValEl = document.getElementById('perTapVal');
        const tapBtn = document.getElementById('tapBtn');
        const boostBtn = document.getElementById('boostBtn');

        tapBtn.addEventListener('click', (e) => {
            if (energy >= perTap) {
                score += perTap;
                energy -= perTap;
                
                scoreEl.innerText = score.toLocaleString();
                energyEl.innerText = energy;

                createPop(e.clientX, e.clientY, `+${perTap}`);
            }
        });

        function createPop(x, y, text) {
            const pop = document.createElement('div');
            pop.classList.add('tap-pop');
            pop.innerText = text;
            
            // Posisi pas di titik sentuh jari
            pop.style.left = `${x - 20}px`;
            pop.style.top = `${y - 40}px`;

            document.body.appendChild(pop);

            setTimeout(() => {
                pop.remove();
            }, 700);
        }

        boostBtn.addEventListener('click', () => {
            if (score >= 30) {
                score -= 30;
                perTap += 1;
                scoreEl.innerText = score.toLocaleString();
                perTapValEl.innerText = `+${perTap}`;
            } else {
                alert("Butuh minimal 30 $GLOOM untuk upgrade!");
            }
        });

        // Isi ulang energi otomatis
        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 3);
                energyEl.innerText = energy;
            }
        }, 1000);
    </script>
</body>
</html>
